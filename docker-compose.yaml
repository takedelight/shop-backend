services:
  shop-database:
    image: postgres:14
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - '${MINIO_PORT}:9000'
      - '${MINIO_CONSOLE_PORT}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASSWORD}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      mc mb --ignore-existing myminio/${STORAGE_BUCKET_NAME};

      mc ilm rm --all --force myminio/${STORAGE_BUCKET_NAME};

      mc ilm rule add --expire-days 1 --prefix 'temp/' myminio/${STORAGE_BUCKET_NAME};

      echo 'MinIO setup completed successfully!';
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
  redis_data:
